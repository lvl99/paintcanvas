<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaintCanvas</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      paint-canvas {
        height: 100%;
      }
      .menu {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #map {
        position: absolute;
        right: 20px;
        bottom: 20px;
      }
      .toasts {
        position: fixed;
        z-index: 30;
        right: 16px;
        bottom: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: none;
      }
      .toasts pc-toast {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <paint-canvas
      store="demo"
      settings-store="demo"
      left-modes="docked, overlay@600"
      right-modes="docked, rail@800, overlay@600"
    >
      <div slot="menu" class="menu">
        <pc-input-settings id="settings"></pc-input-settings>
        <pc-app-settings id="app-settings"></pc-app-settings>
        <pc-theme-picker></pc-theme-picker>
        <pc-button id="new-drawing">New drawing</pc-button>
      </div>
      <div slot="overlay">
        <pc-canvas-map id="map"></pc-canvas-map>
      </div>
    </paint-canvas>
    <div class="toasts" id="toasts"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
